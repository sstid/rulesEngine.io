id: lib/rulesengine.io
language: javascript
layer: library

project:
  title: rulesEngine.io
  description: Isomorphic rules engine based on spoken language verb tenses.

tasks:
  lint:
    command:
      - eslint
      - --ignore-path
      - .gitignore
      - .

  test:
    command:
      - nyc
      - --eager
      - 'true'
      - --reporter
      - lcov
      - --reporter
      - text
      - mocha
      - -R
      - progress
      - --recursive
    options:
      runInCI: skip

  verify-version:
    command:
      - node
      - tool/verify-npm-version.js

  test-ci:
    command:
      - nyc
      - --eager
      - 'true'
      - --reporter
      - lcov
      - --reporter
      - text
      - mocha
      - -R
      - progress
      - --recursive
    outputs:
      - coverage/**
